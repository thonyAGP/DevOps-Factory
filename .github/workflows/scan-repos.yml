name: Scan Repos

on:
  schedule:
    # Every 12 hours (reduced from 6h to save API quota)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: scan-repos
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan and configure repos
        run: pnpm scan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Sync registry (auto-add new repos)
        run: pnpm sync-registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update outcome registry (track PR results)
        run: pnpm outcome-registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit scan report
        run: |
          git config user.name "DevOps Factory Bot"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add dashboard/scan-report.json data/activity-log.json factory.config.ts data/outcome-registry.json data/pattern-scores.json data/patterns.json
          git diff --cached --quiet || git commit -m "chore: update scan report"
          if git pull --rebase --autostash; then
            git push
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          git stash pop 2>/dev/null || true
          cp dashboard/scan-report.json /tmp/scan-report-backup.json
          cp data/activity-log.json /tmp/activity-log-backup.json
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/scan-report-backup.json dashboard/scan-report.json
          cp /tmp/activity-log-backup.json data/activity-log.json
          git add dashboard/scan-report.json data/activity-log.json
          git diff --cached --quiet || git commit -m "chore: update scan report"
          git push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
