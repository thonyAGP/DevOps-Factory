# DevOps-Factory: Central Security Scan
# Runs gitleaks + semgrep + trivy against every managed repo FROM this
# public repo (unlimited free Actions minutes), because private repos on
# the Free plan have no Code Scanning and a 2000 min/month quota.
# Results: dashboard data + consolidated issue (label: central-scan).

name: Central Security Scan

on:
  schedule:
    - cron: '0 5 * * 1' # Weekly Monday 5am UTC
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: central-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trivy re-downloads a ~700MB vulnerability DB otherwise; caching it
      # across weekly runs removes that download for all 25 repo scans
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      # Semgrep re-fetches its registry rulesets (p/owasp-top-ten, …) per run
      - name: Cache Semgrep rules
        uses: actions/cache@v4
        with:
          path: ~/.semgrep
          key: semgrep-rules-${{ github.run_id }}
          restore-keys: |
            semgrep-rules-

      - name: Install scanners
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          # Download the release binary directly — trivy's contrib/install.sh is fragile
          # and old releases (e.g. 0.58.x) no longer carry binary assets
          TRIVY_VERSION=0.72.0
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /tmp trivy
          sudo mv /tmp/trivy /usr/local/bin/trivy
          pipx install semgrep
          gitleaks version
          trivy --version
          semgrep --version

      - name: Run central scan
        run: pnpm central-scan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Reuse the cached DB and skip its update when it is already fresh
          TRIVY_CACHE_DIR: ~/.cache/trivy
          TRIVY_SKIP_DB_UPDATE: 'false'

      - name: Commit scan data
        run: |
          git config user.name "DevOps Factory Bot"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          # The scan takes ~20 min and hourly crons push to master meanwhile —
          # re-apply the scan outputs onto the fresh remote head instead of
          # rebasing. activity-log.json is deliberately NOT committed here:
          # it is written by hourly workflows and would conflict every run.
          cp data/central-scan-latest.json /tmp/central-scan-latest.json
          cp data/central-scan-report.md /tmp/central-scan-report.md
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/central-scan-latest.json data/central-scan-latest.json
          cp /tmp/central-scan-report.md data/central-scan-report.md
          git add data/central-scan-latest.json data/central-scan-report.md
          git diff --cached --quiet || git commit -m "chore: update central scan report" --no-verify
          git push origin master
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
