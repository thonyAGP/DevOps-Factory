name: Self-Heal CI

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repository (owner/name)'
        required: true
        type: string
      run_id:
        description: 'Failed workflow run ID'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-heal-${{ github.event.inputs.repo }}
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run self-healing analysis
        run: pnpm self-heal -- --repo "$TARGET_REPO" --run-id "$TARGET_RUN_ID"
        env:
          TARGET_REPO: ${{ inputs.repo }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

      - name: Commit pattern DB updates
        run: |
          git config user.name "DevOps Factory Bot"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add data/patterns.json data/self-heal-cooldown.json
          git diff --cached --quiet || git commit -m "chore: update self-heal patterns" --no-verify
          git pull --rebase --autostash || true
          git push || true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
