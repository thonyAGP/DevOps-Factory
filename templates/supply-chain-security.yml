name: Supply Chain Security
'on':
  pull_request:
    branches:
    - main
    - master
    paths:
    - package.json
    - pnpm-lock.yaml
    - yarn.lock
    - package-lock.json
    - .github/workflows/supply-chain-security.yml
  schedule:
  - cron: 0 7 * * 3
permissions:
  contents: read
  pull-requests: write
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Detect applicable project
      id: scope
      shell: bash
      run: |-
        if [ -f package.json ]; then
          echo 'applicable=true' >> "$GITHUB_OUTPUT"
        else
          echo 'applicable=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Not applicable: no Node project in this directory; no Node validation claimed'
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: '{{nodeVersion}}'
      if: steps.scope.outputs.applicable == 'true'
    - name: Install dependencies
      run: |
        if [ -f "pnpm-lock.yaml" ]; then
          npm install -g pnpm@{{pnpmVersion}} && pnpm install --frozen-lockfile
        elif [ -f "yarn.lock" ]; then
          yarn install --frozen-lockfile
        else
          npm ci
        fi
      if: steps.scope.outputs.applicable == 'true'
    - name: Dependency audit with validated result
      id: audit
      run: |
        set -euo pipefail
        STATUS=0
        if [ -f pnpm-lock.yaml ]; then
          pnpm audit --json > /tmp/audit.json || STATUS=$?
        elif [ -f yarn.lock ]; then
          echo '::error::Configure a Yarn audit before claiming a dependency result'; exit 1
        else
          npm audit --json > /tmp/audit.json || STATUS=$?
        fi
        node <<'NODE'
        const fs = require('fs');
        const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
        const counts = audit.metadata?.vulnerabilities;
        if (audit.error || !counts || !['critical','high','moderate'].every(k => Number.isInteger(counts[k]) && counts[k] >= 0)) throw new Error('Dependency audit unavailable; no zero-vulnerability result claimed');
        for (const key of ['critical','high','moderate']) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${counts[key]}\n`);
        for (const a of Object.values(audit.advisories ?? {})) {
          if (['critical','high'].includes(a.severity)) console.log(JSON.stringify({package:a.module_name,severity:a.severity,vulnerable:a.vulnerable_versions,patched:a.patched_versions,title:a.title,url:a.url}));
        }
        console.log('Dependency vulnerability counts: ' + JSON.stringify(counts));
        NODE
      if: steps.scope.outputs.applicable == 'true'
    - name: Verify npm signatures
      id: signatures
      run: |
        set -euo pipefail
        npm audit signatures 2>&1 | tee /tmp/sig-check.txt
        VERIFIED=$(grep -oP '\d+(?= packages? have verified registry signatures)' /tmp/sig-check.txt || true)
        VERIFIED="${VERIFIED:-0} verified"
        INVALID=$(awk '/invalid/{n++} END{print n+0}' /tmp/sig-check.txt)
        INVALID=${INVALID:-0}
        echo "verified=$VERIFIED" >> $GITHUB_OUTPUT
        echo "invalid=$INVALID" >> $GITHUB_OUTPUT
      if: steps.scope.outputs.applicable == 'true' && hashFiles('package-lock.json') != ''
    - name: Check for known malicious packages
      id: malicious
      run: |
        node -e "
          const pkg = require('./package.json');
          const allDeps = Object.keys({ ...pkg.dependencies, ...pkg.devDependencies });

          // Known patterns of typosquatting / malicious packages
          const suspicious = [];
          const knownPrefixes = ['@anthropic', '@vercel', '@next', '@prisma', '@types'];

          for (const dep of allDeps) {
            // Check for dashes vs underscores confusion
            if (dep.includes('_') && allDeps.some(d => d === dep.replace(/_/g, '-'))) {
              suspicious.push({ name: dep, reason: 'underscore variant exists' });
            }
            // Check for very short scoped packages (potential squats)
            if (dep.startsWith('@') && dep.split('/')[1]?.length <= 2) {
              suspicious.push({ name: dep, reason: 'very short scoped name' });
            }
          }

          console.log(JSON.stringify({ count: suspicious.length, packages: suspicious }));
        " > /tmp/suspicious.json
        COUNT=$(node -e "console.log(require('/tmp/suspicious.json').count)")
        echo "suspicious=$COUNT" >> $GITHUB_OUTPUT
      if: steps.scope.outputs.applicable == 'true'
    - name: Check for install scripts
      id: scripts
      run: |
        node <<'NODE'
        const fs = require('fs');
        const path = require('path');
        const seen = new Set();
        let count = 0;
        function container(directory) {
          for (const entry of fs.readdirSync(directory, {withFileTypes: true})) {
            if (entry.name === '.bin' || entry.name === '.cache') continue;
            const target = path.join(directory, entry.name);
            if (!(entry.isDirectory() || entry.isSymbolicLink())) continue;
            if (entry.name === '.pnpm') {
              for (const item of fs.readdirSync(target, {withFileTypes: true})) {
                const nested = path.join(target, item.name, 'node_modules');
                if (item.isDirectory() && fs.existsSync(nested)) container(nested);
              }
            } else if (entry.name.startsWith('@')) container(target);
            else {
              const actual = fs.realpathSync(target);
              if (seen.has(actual)) continue;
              seen.add(actual);
              const manifest = path.join(actual, 'package.json');
              if (!fs.existsSync(manifest)) continue;
              const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'));
              if (['preinstall','install','postinstall'].some(key => typeof pkg.scripts?.[key] === 'string')) count++;
              const nested = path.join(actual, 'node_modules');
              if (fs.existsSync(nested)) container(nested);
            }
          }
        }
        container('node_modules');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `install_scripts=${count}\n`);
        console.log(`Installed packages with lifecycle scripts: ${count}; scripts were inspected, not executed by this check.`);
        NODE
      if: steps.scope.outputs.applicable == 'true'
    - name: Comment PR
      if: steps.scope.outputs.applicable == 'true' && (github.event_name == 'pull_request')
      uses: actions/github-script@v7
      with:
        script: "const critical = parseInt('${{ steps.audit.outputs.critical }}') || 0;\nconst high = parseInt('${{ steps.audit.outputs.high }}')\
          \ || 0;\nconst moderate = parseInt('${{ steps.audit.outputs.moderate }}') || 0;\nconst invalid = parseInt('${{ steps.signatures.outputs.invalid\
          \ }}') || 0;\nconst suspicious = parseInt('${{ steps.malicious.outputs.suspicious }}') || 0;\n\nconst hasIssues = critical > 0 || high\
          \ > 0 || invalid > 0;\nconst status = hasIssues ? '\U0001F534' : '\U0001F7E2';\nlet body = `## ${status} Supply Chain Security\\n\\\
          n`;\nbody += `| Check | Result |\\n|-------|--------|\\n`;\nbody += `| Critical vulnerabilities | ${critical} |\\n`;\nbody += `| High\
          \ vulnerabilities | ${high} |\\n`;\nbody += `| Moderate vulnerabilities | ${moderate} |\\n`;\nbody += `| Invalid signatures | ${invalid}\
          \ |\\n`;\nbody += `| Suspicious packages | ${suspicious} |\\n`;\nbody += `| Packages with install scripts | ${{ steps.scripts.outputs.install_scripts\
          \ }} |\\n`;\nbody += `| Signature verification | ${{ steps.signatures.outputs.verified }} |\\n`;\n\nif (hasIssues) {\n  body += `\\\
          n> \U0001F534 Critical security issues found. Run \\`npm audit fix\\` or update affected packages.\\n`;\n}\n\nconst marker = '<!-- devops-factory:supply-chain\
          \ -->';\nbody = marker + '\\n' + body;\nconst { data: comments } = await github.rest.issues.listComments({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  issue_number: context.issue.number,\n  per_page: 100,\n});\nconst existing = comments.find((c) => c.body.startsWith(marker));\n\
          if (existing) {\n  await github.rest.issues.updateComment({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n    comment_id:\
          \ existing.id,\n    body,\n  });\n} else {\n  await github.rest.issues.createComment({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n\
          \    issue_number: context.issue.number,\n    body,\n  });\n}\n"
    - name: Fail on critical/high
      if: steps.scope.outputs.applicable == 'true' && (steps.audit.outputs.critical != '0' || steps.audit.outputs.high != '0')
      run: |
        echo "::error::Found critical (${{ steps.audit.outputs.critical }}) or high (${{ steps.audit.outputs.high }}) vulnerabilities"
        exit 1
    - name: Create issue on schedule
      if: steps.scope.outputs.applicable == 'true' && (github.event_name == 'schedule' && (steps.audit.outputs.critical != '0' || steps.audit.outputs.high
        != '0'))
      uses: actions/github-script@v7
      with:
        script: "const title = `\U0001F512 Supply chain: ${${{ steps.audit.outputs.critical }}} critical, ${${{ steps.audit.outputs.high }}} high\
          \ vulnerabilities`;\nconst existing = await github.rest.issues.listForRepo({\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n\
          \  labels: 'security',\n  state: 'open',\n});\nif (!existing.data.some(i => i.title.includes('Supply chain'))) {\n  await github.rest.issues.create({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    title,\n    labels: ['security', 'automated'],\n  });\n}\n"
    timeout-minutes: 15
