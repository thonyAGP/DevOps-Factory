# DevOps-Factory: Remediation Dispatch
# Reads the security registry and fires a bounded remediation agent at the
# worst-graded repos (saut #3). Fail-closed: does nothing until
# REMEDIATION_CONFIG is enabled with an explicit allowlist. Manual dispatch
# only — no cron until the loop is trusted.

name: Remediation Dispatch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List targets without dispatching agents'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: remediation-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dispatch remediation agents
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            pnpm remediation-dispatch
          else
            pnpm remediation-dispatch -- --dry-run
          fi
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Persist the daily quota so maxPerDay actually holds across runs —
      # without this the counter dies with the runner and the cap is a no-op.
      - name: Commit quota state
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "DevOps Factory Bot"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          if [ -f data/remediation-quota.json ]; then
            cp data/remediation-quota.json /tmp/remediation-quota.json
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/remediation-quota.json data/remediation-quota.json
            git add data/remediation-quota.json
            git diff --cached --quiet || git commit -m "chore: update remediation quota" --no-verify
            git push origin master
          fi
