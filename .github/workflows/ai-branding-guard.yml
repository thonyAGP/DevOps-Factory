name: AI Branding Guard

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 3h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  branding-guard:
    runs-on: ubuntu-latest
    steps:
      # GitHub App token (short-lived, 1h) when configured, else the legacy
      # PAT. Zero-downtime: skipped until repo var FACTORY_APP_ID is set.
      # See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.FACTORY_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI Branding Guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_PAT }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_PAT }}
        run: pnpm ai-branding-guard
