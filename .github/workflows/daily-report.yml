name: Daily Report

on:
  schedule:
    # Every day at 7:00 UTC (8:00 Madrid time)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run scan first to get fresh data
      - name: Scan repos
        run: pnpm scan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Then generate report and create issue
      - name: Generate daily report
        run: pnpm dashboard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
