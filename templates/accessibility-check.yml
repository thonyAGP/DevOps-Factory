name: Accessibility Check
'on':
  pull_request:
    branches:
    - main
    - master
    paths:
    - src/**
    - app/**
    - pages/**
    - components/**
    - '**/*.tsx'
    - '**/*.jsx'
  schedule:
  - cron: 0 6 * * 1
permissions:
  contents: read
  pull-requests: write
jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Detect applicable project
      id: scope
      shell: bash
      run: |-
        if [ -f package.json ] && { compgen -G 'next.config.*' >/dev/null || compgen -G 'astro.config.*' >/dev/null || compgen -G 'vite.config.*' >/dev/null; }; then
          echo 'applicable=true' >> "$GITHUB_OUTPUT"
        else
          echo 'applicable=false' >> "$GITHUB_OUTPUT"
          echo '::notice::No supported web application in this directory; no accessibility result claimed'
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: '{{nodeVersion}}'
      if: steps.scope.outputs.applicable == 'true'
    - name: Install dependencies
      run: npm install -g pa11y-ci@4
      if: steps.scope.outputs.applicable == 'true'
    - name: Detect start command
      id: detect
      run: |
        if [ -f "next.config.mjs" ] || [ -f "next.config.js" ] || [ -f "next.config.ts" ]; then
          echo "framework=nextjs" >> $GITHUB_OUTPUT
        elif [ -f "astro.config.mjs" ]; then
          echo "framework=astro" >> $GITHUB_OUTPUT
        else
          echo "framework=static" >> $GITHUB_OUTPUT
        fi
      if: steps.scope.outputs.applicable == 'true'
    - name: Install project deps
      run: |
        if [ -f "pnpm-lock.yaml" ]; then
          npm install -g pnpm@{{pnpmVersion}} && pnpm install --frozen-lockfile
        elif [ -f "yarn.lock" ]; then
          yarn install --frozen-lockfile
        elif [ -f "package-lock.json" ]; then
          npm ci
        fi
      if: steps.scope.outputs.applicable == 'true'
    - name: Build project
      run: npm run build
      if: steps.scope.outputs.applicable == 'true'
    - name: Start server and run pa11y
      id: a11y
      run: |
        set -euo pipefail
        if [ "${{ steps.detect.outputs.framework }}" = nextjs ]; then
          npx --no-install next start -p 3999 &
        elif [ "${{ steps.detect.outputs.framework }}" = astro ]; then
          npx --no-install astro preview --port 3999 &
        else
          npx --yes serve@14 dist -l 3999 &
        fi
        SERVER_PID=$!
        trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
        READY=false
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:3999 >/dev/null 2>&1; then READY=true; break; fi
          sleep 2
        done
        if [ "$READY" != true ]; then echo '::error::Web application not ready; no accessibility result'; exit 1; fi
        node -e "require('fs').writeFileSync('/tmp/pa11y-ci.json', JSON.stringify({defaults:{standard:'WCAG2AA',threshold:5,chromeLaunchConfig:{args:['--no-sandbox']}},urls:['http://localhost:3999']}))"
        pa11y-ci --config /tmp/pa11y-ci.json 2>&1 | tee /tmp/a11y-report.txt
        VIOLATIONS=$(awk '/Error:/ { n++ } END { print n+0 }' /tmp/a11y-report.txt)
        echo "violations=$VIOLATIONS" >> "$GITHUB_OUTPUT"
      if: steps.scope.outputs.applicable == 'true'
    - name: Comment PR with results
      if: steps.scope.outputs.applicable == 'true' && (github.event_name == 'pull_request' && steps.a11y.outputs.violations != '0')
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('/tmp/a11y-report.txt', 'utf8');
          const violations = '${{ steps.a11y.outputs.violations }}';
          const truncated = report.substring(0, 3000);

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `## Accessibility Check (WCAG 2.1 AA)\n\n**${violations} violation(s) found**\n\n\`\`\`\n${truncated}\n\`\`\`\n\n> Fix these to improve SEO and legal compliance.`,
          });
    timeout-minutes: 15
