name: AI Test Writer

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repo (owner/name) or empty for all'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate AI tests
        run: |
          if [ -n "$TARGET_REPO" ]; then
            pnpm ai-test-writer -- --repo "$TARGET_REPO"
          else
            pnpm ai-test-writer
          fi
        env:
          TARGET_REPO: ${{ inputs.repo }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit quota data
        run: |
          git config user.name "devops-factory[bot]"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add data/ai-test-quota.json
          git diff --cached --quiet || git commit -m "chore: update ai-test quota" --no-verify
          git pull --rebase --autostash
          git push
