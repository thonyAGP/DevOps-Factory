name: Dead Code Detection
'on':
  pull_request:
    branches:
    - main
    - master
    paths:
    - src/**
    - app/**
    - lib/**
    - package.json
    - tsconfig.json
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: dead-code-${{ github.ref }}
  cancel-in-progress: true
jobs:
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Detect applicable project
      id: scope
      shell: bash
      run: |-
        if [ -f package.json ]; then
          echo 'applicable=true' >> "$GITHUB_OUTPUT"
        else
          echo 'applicable=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Not applicable: no Node project in this directory; no Node validation claimed'
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: '{{nodeVersion}}'
      if: steps.scope.outputs.applicable == 'true'
    - name: Install dependencies
      run: |
        if [ -f "pnpm-lock.yaml" ]; then
          npm install -g pnpm@{{pnpmVersion}} && pnpm install --frozen-lockfile
        elif [ -f "yarn.lock" ]; then
          yarn install --frozen-lockfile
        elif [ -f "package-lock.json" ]; then
          npm ci
        fi
      if: steps.scope.outputs.applicable == 'true'
    - name: Run Knip
      id: knip
      run: |
        set -euo pipefail
        STATUS=0
        npx --yes knip@5 --reporter json > /tmp/knip-report.json 2>/tmp/knip-error.txt || STATUS=$?
        if [ "$STATUS" -gt 1 ]; then echo '::error::Knip execution failed; no dead-code result'; exit 1; fi
        node <<'NODE'
        const fs = require('fs');
        const report = JSON.parse(fs.readFileSync('/tmp/knip-report.json', 'utf8'));
        if (!Array.isArray(report.issues) || (report.files !== undefined && !Array.isArray(report.files))) throw new Error('Invalid Knip report; no result claimed');
        fs.writeFileSync('/tmp/knip-report.txt', JSON.stringify(report, null, 2));
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_issues=${(report.files?.length ?? 0) > 0 || report.issues.length > 0}\n`);
        NODE
      if: steps.scope.outputs.applicable == 'true'
    - name: Comment PR with dead code report
      if: steps.scope.outputs.applicable == 'true' && (github.event_name == 'pull_request' && steps.knip.outputs.has_issues == 'true')
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('/tmp/knip-report.txt', 'utf8');
          const truncated = report.substring(0, 4000);

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `## Dead Code Detection (Knip)\n\n\`\`\`\n${truncated}\n\`\`\`\n\n> Remove unused code to keep the codebase lean. Run \`npx knip --fix\` to auto-remove unused exports and deps.`,
          });
