name: AI Branding Guard

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 3h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  branding-guard:
    runs-on: ubuntu-latest
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The script commits inside fresh clones under $RUNNER_TEMP, not in this
      # checkout: the identity must be --global or the clones never see it
      # ("fatal: empty ident name", red since 2026-07-07).
      - name: Configure git identity
        run: |
          git config --global user.name "DevOps Factory Bot"
          git config --global user.email "devops-factory[bot]@users.noreply.github.com"

      - name: Run AI Branding Guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm ai-branding-guard
