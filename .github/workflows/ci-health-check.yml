name: CI Health Check

on:
  schedule:
    # Every hour (reduced from 2h to minimize detection lag)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs: {}
  workflow_run:
    workflows: ['Factory CI']
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: ci-health-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip if triggered by workflow_run that succeeded (only react to failures)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Health Check
        id: health
        run: pnpm ci-health
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit health state and activity log
        if: ${{ always() && steps.health.outcome != 'skipped' }}
        run: |
          git config user.name "DevOps Factory Bot"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          state_files=(data/activity-log.json data/ci-failure-tracker.json data/escalation-tracker.json data/self-heal-cooldowns.json)
          state_backup=$(mktemp -d)
          trap 'rm -rf "$state_backup"' EXIT
          for file in "${state_files[@]}"; do
            if [ -f "$file" ]; then
              cp "$file" "$state_backup/$(basename "$file")"
              git add -- "$file"
            fi
          done
          git diff --cached --quiet || git commit -m "chore: update CI health state" --no-verify
          if git pull --rebase --autostash; then
            git push
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          git stash pop 2>/dev/null || true
          git fetch origin master
          git reset --hard origin/master
          for file in "${state_files[@]}"; do
            if [ -f "$state_backup/$(basename "$file")" ]; then
              if [ "$file" = "data/self-heal-cooldowns.json" ]; then
                node -e '
                  const fs = require("node:fs");
                  const [target, snapshot] = process.argv.slice(1);
                  const read = (path) => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : {};
                  const merged = read(target);
                  for (const [repo, timestamp] of Object.entries(read(snapshot))) {
                    if (!Number.isFinite(timestamp)) throw new Error("Invalid cooldown timestamp");
                    const remote = merged[repo] ?? 0;
                    if (!Number.isFinite(remote)) throw new Error("Invalid remote cooldown timestamp");
                    merged[repo] = Math.max(remote, timestamp);
                  }
                  fs.writeFileSync(target, JSON.stringify(merged, null, 2) + "\n");
                ' "$file" "$state_backup/$(basename "$file")"
              else
                cp "$state_backup/$(basename "$file")" "$file"
              fi
              git add -- "$file"
            fi
          done
          git diff --cached --quiet || git commit -m "chore: update CI health state" --no-verify
          git push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
