name: Migration Tracker

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub App token (short-lived, 1h) when configured, else the legacy
      # PAT. Zero-downtime: skipped until repo var FACTORY_APP_ID is set.
      # See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.FACTORY_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.FACTORY_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Track migration progress
        run: pnpm migration-tracker
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_PAT }}

      - name: Commit data
        run: |
          git config user.name "devops-factory[bot]"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add data/migration-history.json data/migration-latest.json
          git diff --cached --quiet || git commit -m "chore: update migration tracking data" --no-verify
          git pull --rebase --autostash
          git push
