# DevOps-Factory: Coverage Gate
# Runs the repo's vitest suite with coverage on every PR, comments the
# numbers, and enforces the ratchet: coverage may never drop below the
# committed .coverage-baseline.json. Non-blocking below the global 60%
# threshold (warning only) until a baseline is committed.

name: Coverage Gate

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: {{pnpmVersion}}

      - uses: actions/setup-node@v4
        with:
          node-version: {{nodeVersion}}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ensure coverage provider
        run: pnpm add -D @vitest/coverage-v8 --no-save || true

      - name: Run tests with coverage
        run: |
          pnpm vitest run \
            --coverage \
            --coverage.reporter=json-summary \
            --coverage.reporter=text \
            --reporter=default || true

      - name: Coverage gate check
        id: gate
        run: |
          SUMMARY=coverage/coverage-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "No coverage summary produced - skipping gate"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

          LINES=$(jq '.total.lines.pct' "$SUMMARY")
          BRANCHES=$(jq '.total.branches.pct' "$SUMMARY")
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"
          echo "Lines: ${LINES}% | Branches: ${BRANCHES}%"

          # Ratchet: never regress below the committed baseline
          if [ -f .coverage-baseline.json ]; then
            BASELINE_LINES=$(jq '.lines' .coverage-baseline.json)
            echo "Baseline lines: ${BASELINE_LINES}%"
            if awk "BEGIN{exit !($LINES < $BASELINE_LINES - 0.01)}"; then
              echo "::error::Coverage regression: lines ${LINES}% < baseline ${BASELINE_LINES}%"
              exit 1
            fi
          fi

          # Global threshold — warning only (informational until a baseline exists)
          if awk "BEGIN{exit !($LINES < 60)}"; then
            echo "::warning::Lines coverage ${LINES}% below the 60% threshold"
          fi

      - name: Comment coverage on PR
        if: always() && steps.gate.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devops-factory:coverage-gate -->';
            const c = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf-8')).total;
            let body = `${marker}\n## Coverage Report\n\n`;
            body += `| Metric | Coverage |\n|--------|----------|\n`;
            body += `| Lines | ${c.lines.pct}% |\n`;
            body += `| Branches | ${c.branches.pct}% |\n`;
            body += `| Functions | ${c.functions.pct}% |\n`;
            body += `| Statements | ${c.statements.pct}% |\n`;
            body += `\n> Generated by DevOps-Factory Coverage Gate`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((x) => x.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
