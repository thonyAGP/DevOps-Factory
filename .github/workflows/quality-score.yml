name: Quality Score

on:
  schedule:
    - cron: '0 8 * * *' # Daily 8am UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - run: pnpm install --frozen-lockfile

      - name: Calculate quality scores
        run: pnpm quality-score
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit quality data
        run: |
          git config user.name "devops-factory[bot]"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add data/quality-history.json data/activity-log.json dashboard/quality-report.md dashboard/quality-scores.json
          git diff --cached --quiet || git commit -m "chore: update quality scores" --no-verify
          if git pull --rebase --autostash; then
            git push
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          git stash pop 2>/dev/null || true
          cp data/quality-history.json /tmp/quality-history-backup.json 2>/dev/null || true
          cp data/activity-log.json /tmp/activity-log-backup.json 2>/dev/null || true
          cp dashboard/quality-report.md /tmp/quality-report-backup.md 2>/dev/null || true
          cp dashboard/quality-scores.json /tmp/quality-scores-backup.json 2>/dev/null || true
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/quality-history-backup.json data/quality-history.json 2>/dev/null || true
          cp /tmp/activity-log-backup.json data/activity-log.json 2>/dev/null || true
          cp /tmp/quality-report-backup.md dashboard/quality-report.md 2>/dev/null || true
          cp /tmp/quality-scores-backup.json dashboard/quality-scores.json 2>/dev/null || true
          git add data/quality-history.json data/activity-log.json dashboard/quality-report.md dashboard/quality-scores.json
          git diff --cached --quiet || git commit -m "chore: update quality scores" --no-verify
          git push
