name: Factory Watchdog

on:
  schedule:
    # Every 12 hours (reduced from 6h to save API quota)
    - cron: '30 */12 * * *'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: factory-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub App token (short-lived, 1h) — sole auth since the PAT was
      # retired. See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Factory Watchdog
        run: pnpm watchdog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit activity log
        run: |
          git config user.name "DevOps Factory Bot"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add data/activity-log.json data/self-heal-cooldowns.json
          git diff --cached --quiet || git commit -m "chore: update activity log" --no-verify
          if git pull --rebase --autostash; then
            git push
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          git stash pop 2>/dev/null || true
          cp data/activity-log.json /tmp/activity-log-backup.json
          cp data/self-heal-cooldowns.json /tmp/cooldowns-backup.json 2>/dev/null || true
          git fetch origin master
          git reset --hard origin/master
          cp /tmp/activity-log-backup.json data/activity-log.json
          cp /tmp/cooldowns-backup.json data/self-heal-cooldowns.json 2>/dev/null || true
          git add data/activity-log.json data/self-heal-cooldowns.json
          git diff --cached --quiet || git commit -m "chore: update activity log" --no-verify
          git push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
