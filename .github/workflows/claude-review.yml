name: Claude Code Review

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository (owner/name)'
        required: true
      pr:
        description: 'PR number'
        required: true

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GitHub App token (short-lived, 1h) when configured, else the legacy
      # PAT. Zero-downtime: skipped until repo var FACTORY_APP_ID is set.
      # See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.FACTORY_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.FACTORY_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - name: Run Claude review
        run: pnpm claude-review -- --repo "$TARGET_REPO" --pr "$TARGET_PR"
        env:
          TARGET_REPO: ${{ inputs.repo }}
          TARGET_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit quota data
        run: |
          git config user.name "devops-factory[bot]"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add data/claude-review-quota.json
          git diff --cached --quiet || git commit -m "chore: update claude review quota" --no-verify
          git pull --rebase --autostash
          git push
