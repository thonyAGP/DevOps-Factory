# DevOps-Factory: Standard CI Template
# Copy this to .github/workflows/ci.yml in target repos
# Auto-detects stack (Node.js, Next.js, .NET) and runs appropriate checks

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
      package-manager: ${{ steps.detect.outputs.package_manager }}
      pnpm-version: ${{ steps.detect.outputs.pnpm_version }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          if compgen -G "*.csproj" > /dev/null || compgen -G "*.sln" > /dev/null; then
            echo "stack=dotnet" >> $GITHUB_OUTPUT
          elif [ -f "next.config.js" ] || [ -f "next.config.mjs" ] || [ -f "next.config.ts" ]; then
            echo "stack=nextjs" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "stack=node" >> $GITHUB_OUTPUT
          else
            echo "::error::No supported project at this working directory; configure project-specific checks"
            exit 1
          fi

          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "package_manager=bun" >> $GITHUB_OUTPUT
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "package_manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "package_manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "package_manager=npm" >> $GITHUB_OUTPUT
          fi
          PNPM_VERSION=$(node -e "const fs=require('fs'); const p=fs.existsSync('package.json')?require('./package.json'):{}; const m=/^pnpm@([0-9]+\.[0-9]+\.[0-9]+)/.exec(p.packageManager || ''); console.log(m?m[1]:'{{pnpmVersion}}')")
          echo "pnpm_version=$PNPM_VERSION" >> $GITHUB_OUTPUT

  ci-node:
    needs: detect-stack
    if: needs.detect-stack.outputs.stack == 'node' || needs.detect-stack.outputs.stack == 'nextjs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: needs.detect-stack.outputs.package-manager == 'pnpm'
        with:
          version: ${{ needs.detect-stack.outputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: {{nodeVersion}}
          cache: ${{ needs.detect-stack.outputs.package-manager != 'bun' && needs.detect-stack.outputs.package-manager || '' }}

      - uses: oven-sh/setup-bun@v2
        if: needs.detect-stack.outputs.package-manager == 'bun'

      - name: Require at least one configured validation
        run: |
          node -e "const p=require('./package.json'); if (!['lint','typecheck','tsc','test','test:coverage','build'].some(k => typeof p.scripts?.[k] === 'string')) throw new Error('No validation script configured')"

      - name: Install dependencies
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          if [ "$PM" = "bun" ]; then
            bun install --frozen-lockfile
          elif [ "$PM" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          SCRIPT=$(node -e "const p=require('./package.json'); console.log(['lint'].find(s => typeof p.scripts?.[s] === 'string') || '')")
          if [ -n "$SCRIPT" ]; then
            "$PM" run "$SCRIPT"
          else
            echo "::notice::lint not configured; no validation claimed"
          fi

      - name: Type check
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          SCRIPT=$(node -e "const p=require('./package.json'); console.log(['typecheck','tsc'].find(s => typeof p.scripts?.[s] === 'string') || '')")
          if [ -n "$SCRIPT" ]; then
            "$PM" run "$SCRIPT"
          else
            echo "::notice::typecheck not configured; no validation claimed"
          fi

      - name: Tests (coverage when configured)
        id: test
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          SCRIPT=$(node -e "const p=require('./package.json'); console.log(['test:coverage','test'].find(s => typeof p.scripts?.[s] === 'string') || '')")
          if [ -n "$SCRIPT" ]; then
            COVERAGE_ARGS=$(node -e "const p=require('./package.json'); const t=p.scripts?.test || ''; const d={...p.dependencies,...p.devDependencies}; console.log(/vitest/.test(t) && (d['@vitest/coverage-v8'] || d['@vitest/coverage-istanbul']) ? '--coverage --coverage.reporter=json-summary' : /jest/.test(t) ? '--coverage --coverageReporters=json-summary' : '')")
            if [ "$SCRIPT" = "test:coverage" ]; then
              "$PM" run "$SCRIPT"
            elif [ -n "$COVERAGE_ARGS" ]; then
              if [ "$PM" = "npm" ]; then
                "$PM" run "$SCRIPT" -- $COVERAGE_ARGS
              else
                "$PM" run "$SCRIPT" $COVERAGE_ARGS
              fi
            else
              echo "::notice::Coverage is not configured for this test runner; running tests only"
              "$PM" run "$SCRIPT"
            fi
          else
            echo "::notice::tests not configured; no validation claimed"
          fi

          if [ -f "coverage/coverage-summary.json" ]; then
            echo "has_coverage=true" >> $GITHUB_OUTPUT
            LINES=$(node -e "try{const c=require('./coverage/coverage-summary.json');console.log(c.total.lines.pct)}catch{console.log(0)}")
            BRANCHES=$(node -e "try{const c=require('./coverage/coverage-summary.json');console.log(c.total.branches.pct)}catch{console.log(0)}")
            FUNCTIONS=$(node -e "try{const c=require('./coverage/coverage-summary.json');console.log(c.total.functions.pct)}catch{console.log(0)}")
            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Load baseline
        if: steps.test.outputs.has_coverage == 'true'
        id: baseline
        run: |
          if [ -f ".coverage-baseline.json" ]; then
            PREV_LINES=$(node -e "try{console.log(require('./.coverage-baseline.json').lines)}catch{console.log(0)}")
            PREV_BRANCHES=$(node -e "try{console.log(require('./.coverage-baseline.json').branches)}catch{console.log(0)}")
            echo "prev_lines=$PREV_LINES" >> $GITHUB_OUTPUT
            echo "prev_branches=$PREV_BRANCHES" >> $GITHUB_OUTPUT
            echo "has_baseline=true" >> $GITHUB_OUTPUT
          else
            echo "has_baseline=false" >> $GITHUB_OUTPUT
          fi

      - name: Check coverage ratchet
        if: steps.test.outputs.has_coverage == 'true' && steps.baseline.outputs.has_baseline == 'true'
        id: ratchet
        run: |
          CURRENT=${{ steps.test.outputs.lines }}
          PREV=${{ steps.baseline.outputs.prev_lines }}
          DIFF=$(node -e "console.log(($CURRENT - $PREV).toFixed(1))")
          echo "delta=$DIFF" >> $GITHUB_OUTPUT
          if (( $(echo "$DIFF < -2" | bc -l) )); then
            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && steps.test.outputs.has_coverage == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const lines = parseFloat('${{ steps.test.outputs.lines }}') || 0;
            const branches = parseFloat('${{ steps.test.outputs.branches }}') || 0;
            const functions = parseFloat('${{ steps.test.outputs.functions }}') || 0;
            const hasBaseline = '${{ steps.baseline.outputs.has_baseline }}' === 'true';
            const prevLines = parseFloat('${{ steps.baseline.outputs.prev_lines }}') || 0;
            const prevBranches = parseFloat('${{ steps.baseline.outputs.prev_branches }}') || 0;
            const ratchetFailed = '${{ steps.ratchet.outputs.failed }}' === 'true';

            const delta = (curr, prev) => {
              const d = (curr - prev).toFixed(1);
              return d > 0 ? `+${d}%` : `${d}%`;
            };
            const icon = (curr, prev) => curr >= prev ? '🟢' : '🔴';

            let body = `## Coverage Report\n\n| Metric | Current |`;
            if (hasBaseline) body += ` Previous | Delta |`;
            body += `\n|--------|---------|`;
            if (hasBaseline) body += `----------|-------|`;
            body += `\n| Lines | ${lines}% |`;
            if (hasBaseline) body += ` ${prevLines}% | ${icon(lines, prevLines)} ${delta(lines, prevLines)} |`;
            body += `\n| Branches | ${branches}% |`;
            if (hasBaseline) body += ` ${prevBranches}% | ${icon(branches, prevBranches)} ${delta(branches, prevBranches)} |`;
            body += `\n| Functions | ${functions}% |`;
            if (hasBaseline) body += ` | |`;
            body += `\n`;
            if (ratchetFailed) {
              body += `\n> 🔴 **Coverage ratchet failed** — dropped more than 2%. Please add tests.\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('Coverage Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Update baseline on main
        if: github.event_name == 'push' && steps.test.outputs.has_coverage == 'true'
        run: |
          cat > .coverage-baseline.json << BASELINE_EOF
          {
            "date": "$(date -I)",
            "lines": ${{ steps.test.outputs.lines }},
            "branches": ${{ steps.test.outputs.branches }},
            "functions": ${{ steps.test.outputs.functions }}
          }
          BASELINE_EOF
          git config user.name "DevOps Factory Bot"
          git config user.email "devops-factory[bot]@users.noreply.github.com"
          git add .coverage-baseline.json
          git diff --cached --quiet || git commit -m "chore: update coverage baseline"
          git push

      - name: Fail on ratchet
        if: steps.ratchet.outputs.failed == 'true'
        run: |
          echo "::error::Coverage dropped by ${{ steps.ratchet.outputs.delta }}% (max allowed: -2%)"
          exit 1

      - name: Build
        run: |
          PM="${{ needs.detect-stack.outputs.package-manager }}"
          SCRIPT=$(node -e "const p=require('./package.json'); console.log(typeof p.scripts?.build === 'string' ? 'build' : '')")
          if [ -n "$SCRIPT" ]; then
            "$PM" run "$SCRIPT"
          else
            echo "::notice::Build not configured; no build validation claimed"
          fi

  ci-dotnet:
    needs: detect-stack
    if: needs.detect-stack.outputs.stack == 'dotnet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '{{dotnetVersion}}'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Tests (coverage when configured)
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          if-no-files-found: ignore

