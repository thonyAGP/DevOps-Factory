name: Branch Protection Audit

on:
  schedule:
    # Every Monday at 9:00 UTC (10:00 Madrid)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub App token (short-lived, 1h) when configured, else the legacy
      # PAT. Zero-downtime: skipped until repo var FACTORY_APP_ID is set.
      # See docs/github-app-migration.md.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.FACTORY_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Branch Protection Audit
        run: pnpm protect-branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
