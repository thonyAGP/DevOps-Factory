name: Control inventory validation

on:
  push:
    branches: [master]
    paths:
      - scripts/github-file-checker.ts
      - scripts/repository-discovery.ts
      - scripts/scan-and-configure.ts
      - scripts/dashboard/**
      - .github/workflows/control-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-inventory-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate actual inventory and dashboard without dispatching
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, existsSync } from 'node:fs';
          for (const task of ['scan', 'dashboard']) {
            try {
              execFileSync('pnpm', [task], {
                encoding: 'utf8', timeout: 600000, maxBuffer: 10 * 1024 * 1024,
                stdio: ['ignore', 'pipe', 'pipe'],
              });
            } catch {
              // Never publish private repository data or captured provider output.
              throw new Error(`Control validation failed at ${task}; no report published`);
            }
          }
          const report = JSON.parse(readFileSync('dashboard/scan-report.json', 'utf8'));
          const active = report.analyses.filter((p) => p.stack !== 'unknown');
          if (!active.length || !existsSync('dashboard/index.html')) throw new Error('Empty control result');
          console.log(`Actual inventory and dashboard validated: ${active.length} projects. No agent dispatch or application writes.`);
          NODE
      - name: Publish only the validated inventory snapshot
        run: |
          cp dashboard/scan-report.json /tmp/validated-scan-report.json
          git fetch origin master
          git reset --hard origin/master
          PUBLISH=$(node --input-type=module - dashboard/scan-report.json /tmp/validated-scan-report.json <<'NODE'
          import { readFileSync } from 'node:fs';
          const [currentPath, candidatePath] = process.argv.slice(2);
          const candidate = JSON.parse(readFileSync(candidatePath, 'utf8'));
          const timestamp = Date.parse(candidate.timestamp);
          if (!Number.isFinite(timestamp) || !candidate.analyses?.length) throw new Error('Invalid validated inventory');
          let current = null;
          try { current = JSON.parse(readFileSync(currentPath, 'utf8')); } catch { /* replace an unusable derived report */ }
          const newer = current?.analyses?.length && Date.parse(current.timestamp) >= timestamp;
          process.stdout.write(newer ? 'false' : 'true');
          NODE
          )
          if [ "$PUBLISH" != true ]; then echo 'A newer inventory is already published'; exit 0; fi
          cp /tmp/validated-scan-report.json dashboard/scan-report.json
          git config user.name 'DevOps Factory Bot'
          git config user.email 'devops-factory[bot]@users.noreply.github.com'
          git add dashboard/scan-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: publish validated inventory snapshot'
          git push origin HEAD:master
